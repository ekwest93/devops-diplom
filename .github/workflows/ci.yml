name: CI - build and push app image

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: diploma-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Prepare SA key
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > /tmp/raw.txt
          python3 - <<'PY'
          text = open('/tmp/raw.txt').read()
          start = text.find('{')
          end = text.rfind('}')
          open('/tmp/sa-key.json', 'w').write(text[start:end+1])
          PY

      - name: Login to Yandex Container Registry
        run: |
          yc config profile create ci-profile || true
          yc config set service-account-key /tmp/sa-key.json
          echo "$(yc iam create-token)" | docker login --username iam --password-stdin cr.yandex

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
